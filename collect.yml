name: Collect Munpia Best

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "today = 투베 / new = 신베"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - new

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      MUNPIA_BEST_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect
        run: python collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Munpia best data"
          git push
